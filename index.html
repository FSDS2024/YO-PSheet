<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Yatham Organics Billing</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f4;
    color:#222;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.header{
    background:#215b32;
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 5px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
    color:#215b32;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:12px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #ccd8ce;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
}

.green{
    background:#215b32;
    color:white;
}

.light{
    background:#e4efe5;
    color:#215b32;
}

.red{
    background:#f7dddd;
    color:#a00000;
}

.bill-row{
    display:grid;
    grid-template-columns:
        2fr
        140px
        80px
        110px
        120px
        45px;

    gap:8px;

    align-items:end;

    margin-bottom:12px;

    padding:12px;

    background:#f8faf8;

    border-radius:10px;
}

.amount{
    padding:11px 0;
    font-weight:bold;
}

.summary{
    max-width:400px;
    margin-left:auto;
}

.sum{
    display:flex;
    justify-content:space-between;
    padding:8px;
}

.grand{
    border-top:2px solid #215b32;
    font-size:20px;
    font-weight:bold;
    margin-top:8px;
    padding-top:12px;
}

.product-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));

    gap:12px;
}

.product-card{
    border:1px solid #d9e3da;
    padding:15px;
    border-radius:10px;
}

.product-card h3{
    margin:0;
    color:#215b32;
}

.telugu{
    margin-top:5px;
}

.meta{
    color:#777;
    font-size:13px;
    margin:5px 0;
}

.price{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    border-top:1px solid #eee;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.toolbar input{
    flex:1;
}

.status{
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    font-weight:bold;
}

.success{
    background:#dff3e3;
    color:#17652b;
}

.error{
    background:#f9dddd;
    color:#9c0000;
}

.loading{
    text-align:center;
    padding:30px;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .bill-row{
        grid-template-columns:1fr 1fr;
    }

    .toolbar{
        flex-direction:column;
    }

}

@media print{

    .no-print{
        display:none!important;
    }

    body{
        background:white;
    }

    .container{
        padding:0;
    }

    .card{
        box-shadow:none;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>YATHAM ORGANICS</h1>

<div>Customer Billing System</div>

</div>


<!-- CUSTOMER -->

<div class="card">

<h2>Customer Details</h2>

<div class="grid">

<div class="form-group">

<label>Customer Name</label>

<input
id="customerName"
placeholder="Walk-in Customer">

</div>


<div class="form-group">

<label>Mobile Number</label>

<input
id="mobile"
placeholder="Mobile Number">

</div>

</div>


<div class="form-group">

<label>Address / Community</label>

<input
id="address"
placeholder="Address">

</div>

</div>


<!-- BILL -->

<div class="card">

<h2>Billing</h2>


<div class="grid">

<div class="form-group">

<label>Bill Date</label>

<input
id="billDate"
type="date">

</div>


<div class="form-group">

<label>Discount ₹</label>

<input
id="discount"
type="number"
value="0"
min="0"
step="0.01">

</div>

</div>


<div id="billItems"></div>


<button
class="light no-print"
onclick="addBillItem()">

＋ Add Product

</button>

</div>


<!-- PAYMENT -->

<div class="card">

<h2>Payment</h2>

<div class="grid">

<div class="form-group">

<label>Payment Mode</label>

<select id="paymentMode">

<option>Cash</option>

<option>UPI</option>

<option>Card</option>

<option>Bank Transfer</option>

</select>

</div>


<div class="form-group">

<label>Payment Status</label>

<select id="paymentStatus">

<option>Paid</option>

<option>Pending</option>

<option>Partially Paid</option>

</select>

</div>

</div>

</div>


<!-- TOTAL -->

<div class="card">

<div class="summary">

<div class="sum">

<span>Subtotal</span>

<b id="subtotal">₹0.00</b>

</div>


<div class="sum">

<span>Discount</span>

<b id="discountTotal">₹0.00</b>

</div>


<div class="sum grand">

<span>Grand Total</span>

<span id="grandTotal">₹0.00</span>

</div>

</div>

</div>


<!-- BUTTONS -->

<div class="card no-print">

<button
class="green"
onclick="saveBill()">

💾 Save Bill

</button>


<button
class="green"
onclick="printBill()">

🖨 Print Bill

</button>


<button
class="light"
onclick="newBill()">

＋ New Bill

</button>


<button
class="light"
onclick="loadProducts()">

🔄 Refresh Products

</button>


<div id="status"></div>

</div>


<!-- PRODUCTS -->

<div class="card no-print">

<h2>Available Products</h2>


<div class="toolbar">

<input
id="search"
placeholder="Search product..."
oninput="renderProducts()">


<select
id="category"
onchange="renderProducts()">

<option value="">All Categories</option>

</select>

</div>


<div id="productList"
class="product-grid">

<div class="loading">

Loading products...

</div>

</div>

</div>


</div>


<script>


/* =================================
   GOOGLE APPS SCRIPT URL
================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyV4y5p_SCHkL7SvNWpAux2CwLBmmfOnLH7BKXKytqlNkt9AjPZnsZtJNVzusJbtwRAOA/exec";


let products = [];


/* =================================
   PAGE LOAD
================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

    document.getElementById(
        "billDate"
    ).value =
        new Date()
        .toISOString()
        .split("T")[0];


    addBillItem();

    loadProducts();

});


/* =================================
   LOAD PRODUCTS FROM GOOGLE SHEET
================================= */

async function loadProducts(){

    const list =
        document.getElementById(
            "productList"
        );

    list.innerHTML =
        '<div class="loading">Loading products...</div>';


    try{

        const response =
            await fetch(
                SCRIPT_URL +
                "?action=products"
            );


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "Unable to load products"
            );

        }


        products =
            result.products || [];


        populateCategories();

        renderProducts();

        refreshBillProductOptions();


        showStatus(
            "Products loaded successfully.",
            "success"
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            '<div class="error status">' +
            '❌ Unable to load products from Google Sheets.<br><br>' +
            error.message +
            '</div>';

    }

}


/* =================================
   CATEGORIES
================================= */

function populateCategories(){

    const category =
        document.getElementById(
            "category"
        );


    const categories =
        [
            ...new Set(
                products
                .map(p=>p.category)
                .filter(Boolean)
            )
        ];


    category.innerHTML =
        '<option value="">All Categories</option>';


    categories.forEach(c=>{

        category.innerHTML +=
            `<option value="${escapeHtml(c)}">
                ${escapeHtml(c)}
            </option>`;

    });

}


/* =================================
   PRODUCT CATALOGUE
================================= */

function renderProducts(){

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();


    const category =
        document.getElementById(
            "category"
        ).value;


    const list =
        products.filter(p=>{

            const text =
                (
                    p.productName +
                    " " +
                    p.teluguName +
                    " " +
                    p.category
                ).toLowerCase();


            return
                text.includes(search) &&
                (
                    !category ||
                    p.category === category
                );

        });


    const box =
        document.getElementById(
            "productList"
        );


    if(!list.length){

        box.innerHTML =
            "<div>No products found.</div>";

        return;

    }


    box.innerHTML =
        list.map(p=>`

        <div class="product-card">

            <h3>
                ${escapeHtml(p.productName)}
            </h3>

            <div class="telugu">
                ${escapeHtml(p.teluguName)}
            </div>

            <div class="meta">
                ${escapeHtml(p.category)}
            </div>

            <div class="price">

                <span>
                    ${escapeHtml(p.packSize)}
                </span>

                <b>
                    ₹${Number(
                        p.sellingPrice
                    ).toFixed(2)}
                </b>

            </div>

        </div>

        `).join("");

}


/* =================================
   PRODUCT OPTIONS
================================= */

function productOptions(){

    let html =
        '<option value="">Select Product</option>';


    products.forEach((p,index)=>{

        html +=
            `<option value="${index}">
                ${escapeHtml(
                    p.productName
                )}
                -
                ${escapeHtml(
                    p.teluguName
                )}
                -
                ${escapeHtml(
                    p.packSize
                )}
            </option>`;

    });


    return html;

}


/* =================================
   ADD BILL ITEM
================================= */

function addBillItem(){

    const container =
        document.getElementById(
            "billItems"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "bill-row";


    row.innerHTML = `

        <div>

            <label>Product</label>

            <select
                class="productSelect">

                ${productOptions()}

            </select>

        </div>


        <div>

            <label>Pack Size</label>

            <select
                class="packSelect">

                <option value="">
                    Select Pack
                </option>

            </select>

        </div>


        <div>

            <label>Qty</label>

            <input
                class="qty"
                type="number"
                min="1"
                value="1">

        </div>


        <div>

            <label>Rate</label>

            <div class="rate amount">
                ₹0.00
            </div>

        </div>


        <div>

            <label>Amount</label>

            <div class="lineAmount amount">
                ₹0.00
            </div>

        </div>


        <button
            class="red removeBtn"
            type="button">

            ✕

        </button>

    `;


    container.appendChild(row);


    const productSelect =
        row.querySelector(
            ".productSelect"
        );


    const packSelect =
        row.querySelector(
            ".packSelect"
        );


    const qty =
        row.querySelector(
            ".qty"
        );


    productSelect
        .addEventListener(
            "change",
            function(){

                updateProductRow(row);

            }
        );


    packSelect
        .addEventListener(
            "change",
            function(){

                updatePackRow(row);

            }
        );


    qty.addEventListener(
        "input",
        calculate
    );


    row.querySelector(
        ".removeBtn"
    ).addEventListener(
        "click",
        function(){

            row.remove();

            calculate();

        }
    );

}


/* =================================
   REFRESH PRODUCT DROPDOWNS
================================= */

function refreshBillProductOptions(){

    document
    .querySelectorAll(
        ".productSelect"
    )
    .forEach(select=>{

        const current =
            select.value;

        select.innerHTML =
            productOptions();

        select.value =
            current;

    });

}


/* =================================
   PRODUCT SELECTED
================================= */

function updateProductRow(row){

    const index =
        Number(
            row.querySelector(
                ".productSelect"
            ).value
        );


    const product =
        products[index];


    const packSelect =
        row.querySelector(
            ".packSelect"
        );


    packSelect.innerHTML =
        '<option value="">Select Pack</option>';


    if(!product){

        row.dataset.rate = "0";

        row.querySelector(
            ".rate"
        ).textContent =
            "₹0.00";

        calculate();

        return;

    }


    /*
       One row in Products =
       one product + one pack size.

       Therefore we add that pack size.
    */

    packSelect.innerHTML +=
        `<option value="${escapeHtml(
            product.packSize
        )}">

            ${escapeHtml(
                product.packSize
            )}

        </option>`;


    packSelect.value =
        product.packSize;


    row.dataset.productIndex =
        index;


    updatePackRow(row);

}


/* =================================
   PACK SELECTED
================================= */

function updatePackRow(row){

    const index =
        Number(
            row.dataset.productIndex
        );


    const product =
        products[index];


    if(!product){

        row.dataset.rate = "0";

        calculate();

        return;

    }


    const rate =
        Number(
            product.sellingPrice
        ) || 0;


    row.dataset.rate =
        rate;


    row.querySelector(
        ".rate"
    ).textContent =
        money(rate);


    calculate();

}


/* =================================
   CALCULATE BILL
================================= */

function calculate(){

    let subtotal = 0;


    document
    .querySelectorAll(
        ".bill-row"
    )
    .forEach(row=>{

        const rate =
            Number(
                row.dataset.rate
            ) || 0;


        const qty =
            Number(
                row.querySelector(
                    ".qty"
                ).value
            ) || 0;


        const amount =
            rate * qty;


        subtotal +=
            amount;


        row.querySelector(
            ".lineAmount"
        ).textContent =
            money(amount);

    });


    const discount =
        Math.min(

            Math.max(

                Number(
                    document
                    .getElementById(
                        "discount"
                    ).value
                ) || 0,

                0

            ),

            subtotal

        );


    document.getElementById(
        "subtotal"
    ).textContent =
        money(subtotal);


    document.getElementById(
        "discountTotal"
    ).textContent =
        money(discount);


    document.getElementById(
        "grandTotal"
    ).textContent =
        money(
            subtotal -
            discount
        );

}


/* =================================
   SAVE BILL
================================= */

async function saveBill(){

    const rows =
        document.querySelectorAll(
            ".bill-row"
        );


    const items = [];

    let subtotal = 0;


    rows.forEach(row=>{

        const index =
            Number(
                row.dataset.productIndex
            );


        const product =
            products[index];


        const pack =
            row.querySelector(
                ".packSelect"
            ).value;


        const qty =
            Number(
                row.querySelector(
                    ".qty"
                ).value
            ) || 0;


        const rate =
            Number(
                row.dataset.rate
            ) || 0;


        if(
            product &&
            pack &&
            qty > 0 &&
            rate > 0
        ){

            const amount =
                rate * qty;


            subtotal +=
                amount;


            items.push({

                productName:
                    product.productName,

                teluguName:
                    product.teluguName,

                packSize:
                    pack,

                qty:
                    qty,

                rate:
                    rate,

                amount:
                    amount

            });

        }

    });


    if(!items.length){

        showStatus(
            "❌ Please select at least one product.",
            "error"
        );

        return;

    }


    const discount =
        Math.min(

            Math.max(

                Number(
                    document
                    .getElementById(
                        "discount"
                    ).value
                ) || 0,

                0

            ),

            subtotal

        );


    const grandTotal =
        subtotal -
        discount;


    const data = {

        action:
            "saveBill",

        billDate:
            document
            .getElementById(
                "billDate"
            ).value,

        customerName:
            document
            .getElementById(
                "customerName"
            ).value,

        mobile:
            document
            .getElementById(
                "mobile"
            ).value,

        address:
            document
            .getElementById(
                "address"
            ).value,

        subtotal:
            subtotal,

        discount:
            discount,

        grandTotal:
            grandTotal,

        paymentMode:
            document
            .getElementById(
                "paymentMode"
            ).value,

        paymentStatus:
            document
            .getElementById(
                "paymentStatus"
            ).value,

        items:
            items

    };


    showStatus(
        "⏳ Saving bill...",
        "success"
    );


    try{

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "Bill could not be saved."
            );

        }


        showStatus(

            "✅ Bill saved successfully! Bill No: " +
            result.billNo,

            "success"

        );


    }catch(error){

        console.error(error);


        showStatus(

            "❌ Bill saving failed: " +
            error.message,

            "error"

        );

    }

}


/* =================================
   NEW BILL
================================= */

function newBill(){

    if(
        !confirm(
            "Start a new bill?"
        )
    ){

        return;

    }


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "mobile"
    ).value = "";


    document.getElementById(
        "address"
    ).value = "";


    document.getElementById(
        "discount"
    ).value = "0";


    document.getElementById(
        "paymentMode"
    ).value = "Cash";


    document.getElementById(
        "paymentStatus"
    ).value = "Paid";


    document.getElementById(
        "billItems"
    ).innerHTML = "";


    addBillItem();

    calculate();

}


/* =================================
   PRINT
================================= */

function printBill(){

    window.print();

}


/* =================================
   STATUS
================================= */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status " +
        type;


    status.innerHTML =
        message;

}


/* =================================
   MONEY
================================= */

function money(value){

    return "₹" +
        Number(
            value || 0
        ).toFixed(2);

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


document.getElementById(
    "discount"
).addEventListener(
    "input",
    calculate
);

</script>


</body>

</html>
