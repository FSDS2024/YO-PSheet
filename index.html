<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yatham Organics Billing</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#222;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.header{
    background:#1f5630;
    color:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:7px 0 0;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    color:#1f5630;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccd8cc;
    border-radius:9px;
    font-size:15px;
    background:white;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-green{
    background:#1f5630;
    color:white;
}

.btn-light{
    background:#e4eee3;
    color:#1f5630;
}

.btn-red{
    background:#f8dddd;
    color:#a00000;
}

button:hover{
    opacity:.9;
}

.bill-table-wrapper{
    overflow-x:auto;
}

.bill-table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

.bill-table th{
    background:#e7f0e6;
    color:#1f5630;
    padding:12px;
    text-align:left;
}

.bill-table td{
    padding:9px;
    border-bottom:1px solid #ddd;
    vertical-align:middle;
}

.bill-table input,
.bill-table select{
    padding:9px;
}

.product-name-display{
    font-weight:bold;
}

.rate{
    font-weight:bold;
    color:#1f5630;
}

.amount{
    font-weight:bold;
}

.summary{
    width:350px;
    max-width:100%;
    margin-left:auto;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
}

.grand-total{
    border-top:2px solid #1f5630;
    margin-top:8px;
    padding-top:12px;
    font-size:21px;
    font-weight:bold;
    color:#1f5630;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.status{
    margin-top:15px;
    font-weight:bold;
}

.success{
    color:#198754;
}

.error{
    color:#c00000;
}

.loading{
    text-align:center;
    padding:25px;
    font-size:17px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.product-card{
    border:1px solid #dce5d9;
    border-radius:12px;
    padding:15px;
}

.product-card h3{
    margin:0 0 5px;
    color:#1f5630;
}

.product-card .telugu{
    margin-bottom:8px;
}

.product-card .category{
    color:#777;
    font-size:13px;
    margin-bottom:10px;
}

.pack-price{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-top:1px solid #eee;
}

.small{
    font-size:13px;
    color:#666;
}

.refresh{
    margin-bottom:15px;
}

@media(max-width:750px){

    .grid{
        grid-template-columns:1fr;
    }

    .container{
        width:97%;
    }

    .header h1{
        font-size:24px;
    }

}

@media print{

    body{
        background:white;
    }

    .no-print{
        display:none !important;
    }

    .container{
        width:100%;
        margin:0;
    }

    .card{
        box-shadow:none;
        border:0;
    }

    .header{
        border-radius:0;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

    <h1>YATHAM ORGANICS</h1>

    <p>Customer Billing System</p>

</div>


<!-- CUSTOMER -->

<div class="card">

<h2>Customer Details</h2>

<div class="grid">

<div class="form-group">

<label>Customer Name</label>

<input
type="text"
id="customerName"
placeholder="Walk-in Customer">

</div>


<div class="form-group">

<label>Mobile Number</label>

<input
type="tel"
id="customerMobile"
placeholder="Mobile Number">

</div>

</div>


<div class="form-group">

<label>Address / Community</label>

<input
type="text"
id="customerAddress"
placeholder="Address">

</div>

</div>


<!-- BILL -->

<div class="card">

<h2>Bill Details</h2>

<div class="grid">

<div class="form-group">

<label>Bill Date</label>

<input
type="date"
id="billDate">

</div>


<div class="form-group">

<label>Discount ₹</label>

<input
type="number"
id="discount"
value="0"
min="0"
step="0.01">

</div>

</div>


<div class="bill-table-wrapper">

<table class="bill-table">

<thead>

<tr>

<th style="width:30%">Product</th>

<th style="width:15%">Pack Size</th>

<th style="width:12%">Quantity</th>

<th style="width:12%">Rate</th>

<th style="width:15%">Amount</th>

<th style="width:8%">Remove</th>

</tr>

</thead>


<tbody id="billItems">

</tbody>

</table>

</div>


<br>


<button
class="btn-light no-print"
onclick="addBillRow()">

＋ Add Product

</button>

</div>


<!-- PAYMENT -->

<div class="card">

<h2>Payment</h2>

<div class="grid">

<div class="form-group">

<label>Payment Mode</label>

<select id="paymentMode">

<option value="Cash">Cash</option>

<option value="UPI">UPI</option>

<option value="Card">Card</option>

<option value="Bank Transfer">Bank Transfer</option>

</select>

</div>


<div class="form-group">

<label>Payment Status</label>

<select id="paymentStatus">

<option value="Paid">Paid</option>

<option value="Pending">Pending</option>

<option value="Partial">Partial</option>

</select>

</div>

</div>

</div>


<!-- TOTAL -->

<div class="card">

<div class="summary">

<div class="summary-row">

<span>Subtotal</span>

<b id="subtotal">₹0.00</b>

</div>


<div class="summary-row">

<span>Discount</span>

<b id="discountAmount">₹0.00</b>

</div>


<div class="summary-row grand-total">

<span>Grand Total</span>

<span id="grandTotal">₹0.00</span>

</div>

</div>

</div>


<!-- BUTTONS -->

<div class="card no-print">

<div class="actions">

<button
class="btn-green"
onclick="saveBill()">

💾 Save Bill

</button>


<button
class="btn-green"
onclick="printBill()">

🖨 Print Bill

</button>


<button
class="btn-light"
onclick="newBill()">

＋ New Bill

</button>


<button
class="btn-light"
onclick="loadProducts()">

🔄 Refresh Products

</button>

</div>


<div id="status" class="status"></div>

</div>


<!-- PRODUCTS -->

<div class="card no-print">

<h2>Available Products</h2>

<div id="productStatus" class="loading">

Loading products from Google Sheets...

</div>


<div
id="productCatalogue"
class="product-grid">

</div>

</div>


</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbycn_UvwXwEsc1HOjvqBRpc8xQyb4hlTR_aTtkix3ePlHg98fD53uZV32p9ycHMEPLa/exec";


/* =========================================================
   GLOBAL PRODUCT DATA
   ========================================================= */

let products = [];


/* =========================================================
   PAGE START
   ========================================================= */

document.addEventListener("DOMContentLoaded", function(){

    document.getElementById("billDate").value =
        new Date().toISOString().split("T")[0];

    loadProducts();

    addBillRow();

});


/* =========================================================
   LOAD PRODUCTS FROM GOOGLE SHEETS
   ========================================================= */

async function loadProducts(){

    const status =
        document.getElementById("productStatus");

    status.innerHTML =
        "⏳ Loading products from Google Sheets...";

    try{

        const url =
            SCRIPT_URL +
            "?action=getProducts&t=" +
            Date.now();

        const response =
            await fetch(url, {
                method:"GET",
                cache:"no-store"
            });

        if(!response.ok){

            throw new Error(
                "HTTP Error " + response.status
            );

        }

        const data =
            await response.json();

        console.log("Google Sheet Response:", data);

        products =
            normalizeProducts(data);

        console.log("Normalized Products:", products);

        if(!products.length){

            status.innerHTML =
                "❌ No products found in Google Sheets.";

            document.getElementById(
                "productCatalogue"
            ).innerHTML = "";

            return;
        }


        status.innerHTML =
            "✅ " +
            products.length +
            " products loaded successfully.";


        renderCatalogue();

        refreshAllProductDropdowns();

    }

    catch(error){

        console.error(error);

        status.innerHTML =
            "❌ Unable to load products from Google Sheets.<br>" +
            "<small>" +
            error.message +
            "</small>";

    }

}


/* =========================================================
   NORMALIZE GOOGLE SHEET DATA
   ========================================================= */

function normalizeProducts(data){

    let rows = [];


    /*
       CASE 1

       {
          success:true,
          products:[...]
       }
    */

    if(
        data &&
        Array.isArray(data.products)
    ){

        rows = data.products;

    }


    /*
       CASE 2

       Direct array
    */

    else if(Array.isArray(data)){

        rows = data;

    }


    /*
       CASE 3

       {data:[...]}
    */

    else if(
        data &&
        Array.isArray(data.data)
    ){

        rows = data.data;

    }


    /*
       CASE 4

       {values:[...]}
    */

    else if(
        data &&
        Array.isArray(data.values)
    ){

        rows = data.values;

    }


    if(!rows.length){

        return [];

    }


    /*
       If rows are arrays,
       first row may be headers.
    */

    if(Array.isArray(rows[0])){

        const headers =
            rows[0].map(x =>
                String(x)
                .trim()
                .toLowerCase()
            );


        if(
            headers.includes("product name") ||
            headers.includes("productname")
        ){

            rows =
                rows.slice(1)
                .map(row => {

                    let obj = {};

                    headers.forEach(
                        (header,index) => {

                            obj[header] =
                                row[index];

                        }
                    );

                    return obj;

                });

        }

    }


    /*
       Convert everything into
       our standard structure.
    */

    let output = [];


    rows.forEach(row => {

        if(!row) return;


        let productId =
            getField(
                row,
                [
                    "product id",
                    "productid",
                    "id"
                ]
            );


        let productName =
            getField(
                row,
                [
                    "product name",
                    "productname",
                    "name"
                ]
            );


        let teluguName =
            getField(
                row,
                [
                    "telugu name",
                    "teluguname",
                    "telugu"
                ]
            );


        let category =
            getField(
                row,
                [
                    "category",
                    "category type"
                ]
            );


        let packSize =
            getField(
                row,
                [
                    "pack size",
                    "packsize",
                    "qty",
                    "quantity"
                ]
            );


        let sellingPrice =
            getField(
                row,
                [
                    "selling price",
                    "sellingprice",
                    "price",
                    "rate"
                ]
            );


        let purchasePrice =
            getField(
                row,
                [
                    "purchase price",
                    "purchaseprice"
                ]
            );


        let stockQuantity =
            getField(
                row,
                [
                    "stock quantity",
                    "stockquantity",
                    "stock"
                ]
            );


        if(!productName){

            return;

        }


        if(!packSize){

            packSize = "Default";

        }


        let price =
            parseFloat(
                String(
                    sellingPrice ?? ""
                )
                .replace(/[₹,\s]/g,"")
            );


        if(isNaN(price)){

            price = 0;

        }


        output.push({

            productId:
                String(productId || ""),

            name:
                String(productName).trim(),

            telugu:
                String(teluguName || "").trim(),

            category:
                String(category || "").trim(),

            pack:
                String(packSize).trim(),

            sellingPrice:
                price,

            purchasePrice:
                purchasePrice,

            stock:
                stockQuantity

        });

    });


    return groupProducts(output);

}


/* =========================================================
   GET FIELD FROM OBJECT
   ========================================================= */

function getField(obj, possibleNames){

    if(!obj || typeof obj !== "object"){

        return "";

    }


    const keys =
        Object.keys(obj);


    for(
        const name of possibleNames
    ){

        const found =
            keys.find(key => {

                const normalized =
                    String(key)
                    .trim()
                    .toLowerCase();

                return normalized ===
                    name.toLowerCase();

            });


        if(found !== undefined){

            return obj[found];

        }

    }


    return "";

}


/* =========================================================
   GROUP SAME PRODUCTS
   ========================================================= */

function groupProducts(rows){

    const map = new Map();


    rows.forEach(row => {

        const key =
            (
                row.productId ||
                row.name
            )
            .toLowerCase()
            .trim();


        if(!map.has(key)){

            map.set(key,{

                productId:
                    row.productId,

                name:
                    row.name,

                telugu:
                    row.telugu,

                category:
                    row.category,

                packs:[]

            });

        }


        const product =
            map.get(key);


        /*
           Add pack only if not
           already present.
        */

        const existing =
            product.packs.find(
                p =>
                    p.pack.toLowerCase() ===
                    row.pack.toLowerCase()
            );


        if(existing){

            existing.price =
                row.sellingPrice;

            existing.stock =
                row.stock;

        }

        else{

            product.packs.push({

                pack:
                    row.pack,

                price:
                    row.sellingPrice,

                stock:
                    row.stock

            });

        }

    });


    return Array.from(map.values());

}


/* =========================================================
   PRODUCT DROPDOWN
   ========================================================= */

function productOptions(){

    let html =
        '<option value="">Select Product</option>';


    products.forEach(
        (product,index) => {

            html +=
                '<option value="' +
                index +
                '">' +
                escapeHTML(product.name) +
                (
                    product.telugu
                    ?
                    " — " +
                    escapeHTML(product.telugu)
                    :
                    ""
                ) +
                '</option>';

        }
    );


    return html;

}


/* =========================================================
   ADD BILL ROW
   ========================================================= */

function addBillRow(){

    const tbody =
        document.getElementById(
            "billItems"
        );


    const tr =
        document.createElement("tr");


    tr.innerHTML = `

        <td>

            <select
                class="productSelect"
                onchange="productChanged(this)">

                ${productOptions()}

            </select>

        </td>


        <td>

            <select
                class="packSelect"
                onchange="packChanged(this)">

                <option value="">
                    Select Pack
                </option>

            </select>

        </td>


        <td>

            <input
                type="number"
                class="qty"
                value="1"
                min="1"
                onchange="calculate()"
                oninput="calculate()">

        </td>


        <td>

            <div class="rate">
                ₹0.00
            </div>

        </td>


        <td>

            <div class="amount">
                ₹0.00
            </div>

        </td>


        <td>

            <button
                type="button"
                class="btn-red"
                onclick="removeRow(this)">

                ✕

            </button>

        </td>

    `;


    tbody.appendChild(tr);

}


/* =========================================================
   PRODUCT CHANGED
   ========================================================= */

function productChanged(select){

    const row =
        select.closest("tr");


    const index =
        Number(select.value);


    const packSelect =
        row.querySelector(
            ".packSelect"
        );


    const rate =
        row.querySelector(".rate");


    packSelect.innerHTML =
        '<option value="">Select Pack</option>';


    rate.textContent =
        "₹0.00";


    row.dataset.price =
        "0";


    if(
        isNaN(index) ||
        !products[index]
    ){

        calculate();

        return;

    }


    const product =
        products[index];


    /*
       Create pack options
    */

    product.packs.forEach(
        (pack,index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                pack.pack;


            /*
               Store price directly
               in option.
            */

            option.dataset.price =
                pack.price;


            packSelect.appendChild(
                option
            );

        }
    );


    /*
       Automatically select
       first available pack.
    */

    if(product.packs.length){

        packSelect.value = "0";

        setPackPrice(
            row,
            product.packs[0]
        );

    }


    calculate();

}


/* =========================================================
   PACK CHANGED
   ========================================================= */

function packChanged(select){

    const row =
        select.closest("tr");


    const productSelect =
        row.querySelector(
            ".productSelect"
        );


    const productIndex =
        Number(productSelect.value);


    if(
        isNaN(productIndex) ||
        !products[productIndex]
    ){

        return;

    }


    const product =
        products[productIndex];


    const packIndex =
        Number(select.value);


    if(
        isNaN(packIndex) ||
        !product.packs[packIndex]
    ){

        row.dataset.price =
            "0";

        row.querySelector(
            ".rate"
        ).textContent =
            "₹0.00";

        calculate();

        return;

    }


    setPackPrice(
        row,
        product.packs[packIndex]
    );

}


/* =========================================================
   SET PRICE
   ========================================================= */

function setPackPrice(row,pack){

    const price =
        Number(pack.price) || 0;


    row.dataset.price =
        price;


    row.querySelector(
        ".rate"
    ).textContent =
        money(price);


    calculate();

}


/* =========================================================
   CALCULATE BILL
   ========================================================= */

function calculate(){

    let subtotal = 0;


    document
    .querySelectorAll("#billItems tr")
    .forEach(row => {

        const price =
            Number(
                row.dataset.price || 0
            );


        const qty =
            Number(
                row.querySelector(
                    ".qty"
                ).value || 0
            );


        const amount =
            price * qty;


        row.querySelector(
            ".amount"
        ).textContent =
            money(amount);


        subtotal += amount;

    });


    let discount =
        Number(
            document.getElementById(
                "discount"
            ).value || 0
        );


    if(discount < 0){

        discount = 0;

    }


    if(discount > subtotal){

        discount = subtotal;

    }


    const total =
        subtotal - discount;


    document.getElementById(
        "subtotal"
    ).textContent =
        money(subtotal);


    document.getElementById(
        "discountAmount"
    ).textContent =
        money(discount);


    document.getElementById(
        "grandTotal"
    ).textContent =
        money(total);

}


/* =========================================================
   REMOVE ROW
   ========================================================= */

function removeRow(button){

    const rows =
        document.querySelectorAll(
            "#billItems tr"
        );


    if(rows.length <= 1){

        alert(
            "At least one product row is required."
        );

        return;

    }


    button
        .closest("tr")
        .remove();


    calculate();

}


/* =========================================================
   REFRESH PRODUCT DROPDOWNS
   ========================================================= */

function refreshAllProductDropdowns(){

    document
    .querySelectorAll(
        ".productSelect"
    )
    .forEach(select => {

        const current =
            select.value;


        select.innerHTML =
            productOptions();


        /*
           Restore previous selection
           if possible.
        */

        if(
            current !== "" &&
            products[current]
        ){

            select.value =
                current;

            productChanged(select);

        }

    });

}


/* =========================================================
   PRODUCT CATALOGUE
   ========================================================= */

function renderCatalogue(){

    const box =
        document.getElementById(
            "productCatalogue"
        );


    box.innerHTML = "";


    products.forEach(product => {

        let packsHTML = "";


        product.packs.forEach(pack => {

            packsHTML += `

                <div class="pack-price">

                    <span>
                        ${escapeHTML(pack.pack)}
                    </span>

                    <b>
                        ${money(pack.price)}
                    </b>

                </div>

            `;

        });


        box.innerHTML += `

            <div class="product-card">

                <h3>
                    ${escapeHTML(product.name)}
                </h3>


                ${
                    product.telugu
                    ?
                    `<div class="telugu">
                        ${escapeHTML(product.telugu)}
                    </div>`
                    :
                    ""
                }


                <div class="category">

                    ${escapeHTML(
                        product.category
                    )}

                </div>


                ${packsHTML}

            </div>

        `;

    });

}


/* =========================================================
   SAVE BILL
   ========================================================= */

async function saveBill(){

    const status =
        document.getElementById(
            "status"
        );


    const rows = [];


    document
    .querySelectorAll(
        "#billItems tr"
    )
    .forEach(row => {

        const productSelect =
            row.querySelector(
                ".productSelect"
            );


        const packSelect =
            row.querySelector(
                ".packSelect"
            );


        const qty =
            Number(
                row.querySelector(
                    ".qty"
                ).value || 0
            );


        const productIndex =
            Number(
                productSelect.value
            );


        const product =
            products[productIndex];


        if(
            product &&
            packSelect.value !== "" &&
            qty > 0
        ){

            const packIndex =
                Number(
                    packSelect.value
                );


            const pack =
                product.packs[
                    packIndex
                ];


            if(pack){

                const rate =
                    Number(pack.price);


                rows.push({

                    productId:
                        product.productId,

                    productName:
                        product.name,

                    teluguName:
                        product.telugu,

                    category:
                        product.category,

                    packSize:
                        pack.pack,

                    quantity:
                        qty,

                    rate:
                        rate,

                    itemAmount:
                        rate * qty

                });

            }

        }

    });


    if(!rows.length){

        alert(
            "Please select at least one product."
        );

        return;

    }


    let subtotal = 0;


    rows.forEach(item => {

        subtotal +=
            item.itemAmount;

    });


    let discount =
        Number(
            document.getElementById(
                "discount"
            ).value || 0
        );


    if(discount < 0){

        discount = 0;

    }


    if(discount > subtotal){

        discount = subtotal;

    }


    const grandTotal =
        subtotal - discount;


    const billNo =
        "BILL-" +
        Date.now();


    const bill = {

        action:"saveBill",

        billNo:
            billNo,

        billDate:
            document.getElementById(
                "billDate"
            ).value,

        customerName:
            document.getElementById(
                "customerName"
            ).value ||
            "Walk-in Customer",

        customerMobile:
            document.getElementById(
                "customerMobile"
            ).value,

        customerAddress:
            document.getElementById(
                "customerAddress"
            ).value,

        paymentMode:
            document.getElementById(
                "paymentMode"
            ).value,

        paymentStatus:
            document.getElementById(
                "paymentStatus"
            ).value,

        subtotal:
            subtotal,

        discount:
            discount,

        grandTotal:
            grandTotal,

        items:
            rows

    };


    status.className =
        "status";


    status.innerText =
        "⏳ Saving bill...";


    try{

        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",

                    body:
                        JSON.stringify(
                            bill
                        )
                }
            );


        const result =
            await response.json();


        console.log(
            "Save response:",
            result
        );


        if(
            result.success
        ){

            status.className =
                "status success";


            status.innerText =
                "✅ Bill saved successfully. Bill No: " +
                (
                    result.billNo ||
                    billNo
                );

        }

        else{

            status.className =
                "status error";


            status.innerText =
                "❌ " +
                (
                    result.message ||
                    "Unable to save bill."
                );

        }

    }

    catch(error){

        console.error(error);


        status.className =
            "status error";


        status.innerText =
            "❌ Error while saving bill.";

    }

}

    .querySelectorAll(

    )

            row.querySelector(

            row.querySelector(

                ).value || 0

/* =========================================================
   MONEY
   ========================================================= */

function money(value){

    return "₹" +
        Number(
            value || 0
        ).toFixed(2);

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}
