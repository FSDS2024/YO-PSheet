<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yatham Organics Billing</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f6f4;
    color:#222;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.header{
    background:#205b32;
    color:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:7px 0 0;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
    color:#205b32;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cdd8cf;
    border-radius:9px;
    font-size:15px;
    background:white;
}

button{
    border:none;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
}

.green{
    background:#205b32;
    color:white;
}

.light{
    background:#e6f0e7;
    color:#205b32;
}

.red{
    background:#f8dddd;
    color:#a00000;
}

.blue{
    background:#e2edf9;
    color:#14548a;
}

button:hover{
    opacity:.9;
}

.bill-row{
    display:grid;
    grid-template-columns:
        2.3fr
        1fr
        .7fr
        1fr
        1fr
        55px;

    gap:10px;
    align-items:end;

    padding:12px;
    border:1px solid #e0e7e1;
    border-radius:12px;
    margin-bottom:10px;
}

.rate,
.amount{
    padding:12px 5px;
    font-weight:bold;
}

.amount{
    text-align:right;
}

.summary{
    max-width:400px;
    margin-left:auto;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
}

.grand-total{
    border-top:2px solid #205b32;
    margin-top:8px;
    padding-top:12px;
    font-size:22px;
    font-weight:bold;
    color:#205b32;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.product-card{
    border:1px solid #dce5dd;
    padding:15px;
    border-radius:12px;
}

.product-card h3{
    color:#205b32;
    margin:0 0 5px;
}

.telugu{
    font-size:17px;
    margin-bottom:7px;
}

.category{
    font-size:12px;
    color:#777;
    margin-bottom:8px;
}

.product-price{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #eee;
    padding:6px 0;
}

.status{
    margin-top:12px;
    font-weight:bold;
}

.success{
    color:#16803c;
}

.error{
    color:#c00000;
}

.loading{
    text-align:center;
    padding:30px;
    font-weight:bold;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .bill-row{
        grid-template-columns:1fr 1fr;
    }

    .products{
        grid-template-columns:1fr;
    }
}

@media print{

    .no-print{
        display:none !important;
    }

    body{
        background:white;
    }

    .container{
        width:100%;
        margin:0;
    }

    .card{
        box-shadow:none;
    }

}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<h1>YATHAM ORGANICS</h1>

<p>Customer Billing System</p>

</div>


<!-- CUSTOMER -->

<div class="card">

<h2>Customer Details</h2>

<div class="grid">

<div>

<label>Customer Name</label>

<input
id="customerName"
placeholder="Walk-in Customer">

</div>


<div>

<label>Mobile Number</label>

<input
id="mobile"
placeholder="Optional">

</div>

</div>


<div style="margin-top:15px">

<label>Address / Community</label>

<input
id="address"
placeholder="Optional">

</div>

</div>



<!-- BILL -->

<div class="card">

<h2>Bill Details</h2>

<div class="grid">

<div>

<label>Bill Number</label>

<input
id="billNo"
readonly>

</div>


<div>

<label>Bill Date</label>

<input
id="billDate"
type="date">

</div>


<div>

<label>Discount (₹)</label>

<input
id="discount"
type="number"
value="0"
min="0"
step="0.01">

</div>

</div>

<br>


<div id="billItems"></div>


<button
class="green no-print"
onclick="addBillRow()">

＋ Add Product

</button>

</div>



<!-- PAYMENT -->

<div class="card">

<h2>Payment</h2>

<div class="grid">

<div>

<label>Payment Mode</label>

<select id="paymentMode">

<option value="Cash">Cash</option>

<option value="UPI">UPI</option>

<option value="Card">Card</option>

<option value="Bank Transfer">
Bank Transfer
</option>

</select>

</div>


<div>

<label>Payment Status</label>

<select id="paymentStatus">

<option value="Paid">Paid</option>

<option value="Pending">Pending</option>

<option value="Partially Paid">
Partially Paid
</option>

</select>

</div>

</div>

</div>



<!-- SUMMARY -->

<div class="card">

<div class="summary">

<div class="summary-row">

<span>Subtotal</span>

<b id="subtotal">
₹0.00
</b>

</div>


<div class="summary-row">

<span>Discount</span>

<b id="discountTotal">
₹0.00
</b>

</div>


<div class="summary-row grand-total">

<span>Grand Total</span>

<span id="grandTotal">
₹0.00
</span>

</div>

</div>

</div>



<!-- ACTIONS -->

<div class="card no-print">

<button
class="green"
onclick="saveBill()">

💾 Save Bill

</button>


<button
class="green"
onclick="printBill()">

🖨 Print Bill

</button>


<button
class="light"
onclick="newBill()">

＋ New Bill

</button>


<button
class="light"
onclick="loadProducts()">

🔄 Refresh Products

</button>


<div
id="status"
class="status">

</div>

</div>



<!-- PRODUCTS -->

<div class="card no-print">

<h2>Available Products</h2>

<div
id="products"
class="products">

<div class="loading">

⏳ Loading products from Google Sheets...

</div>

</div>

</div>

</div>



<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxHKYcJn--lapvAoP1fdN9F2O-B23KUIMrGslU4x09RvVjuK4aJPTUsAUjjBRG4xlgE/exec";


/* =====================================================
   GLOBAL PRODUCTS
   ===================================================== */

let products = [];


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return "₹" +
        Number(value || 0)
        .toFixed(2);

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.className =
        "status " + type;

    status.innerText =
        message;

}


/* =====================================================
   GENERATE BILL NUMBER
   ===================================================== */

function generateBillNo(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    const random =
        Math.floor(
            1000 + Math.random()*9000
        );

    return "YO-" +
        year +
        month +
        day +
        "-" +
        random;

}


/* =====================================================
   LOAD PRODUCTS FROM GOOGLE SHEETS
   ===================================================== */

async function loadProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML =
        '<div class="loading">' +
        '⏳ Loading products from Google Sheets...' +
        '</div>';

    try{

        const response =
            await fetch(
                SCRIPT_URL +
                "?action=getProducts&callback=x"
            );

        const text =
            await response.text();

        console.log("Google response:",text);

        let result;

        try{

            result =
                JSON.parse(text);

        }catch(error){

            throw new Error(
                "Google Apps Script did not return JSON. Check doGet()."
            );

        }


        if(!result.success){

            throw new Error(
                result.message ||
                "Unable to load products."
            );

        }


        products =
            result.products || [];


        renderProducts();

        refreshProductDropdowns();

    }
    catch(error){

        console.error(error);

        container.innerHTML =
            '<div class="error">' +
            '❌ Unable to load products from Google Sheets.<br><br>' +
            escapeHTML(error.message) +
            '</div>';

    }

}


/* =====================================================
   RENDER PRODUCTS
   ===================================================== */

function renderProducts(){

    const container =
        document.getElementById("products");

    if(!products.length){

        container.innerHTML =
            "<p>No products found in Google Sheets.</p>";

        return;

    }


    container.innerHTML =
        products.map(function(product){

            const prices =
                product.prices || {};


            const priceHTML =
                Object.entries(prices)
                .map(function(entry){

                    const pack =
                        entry[0];

                    const price =
                        entry[1];

                    return `
                    <div class="product-price">

                        <span>
                            ${escapeHTML(pack)}
                        </span>

                        <b>
                            ${money(price)}
                        </b>

                    </div>
                    `;

                })
                .join("");


            return `

            <div class="product-card">

                <h3>
                    ${escapeHTML(product.productName)}
                </h3>

                <div class="telugu">
                    ${escapeHTML(product.teluguName)}
                </div>

                <div class="category">
                    ${escapeHTML(product.category)}
                </div>

                ${priceHTML}

            </div>

            `;

        }).join("");

}


/* =====================================================
   PRODUCT OPTIONS
   ===================================================== */

function getProductOptions(){

    let html =
        '<option value="">Select Product</option>';

    products.forEach(function(product,index){

        html += `

        <option value="${index}">

            ${escapeHTML(product.productName)}
            ${product.teluguName ?
            " — " +
            escapeHTML(product.teluguName)
            : ""}

        </option>

        `;

    });

    return html;

}


/* =====================================================
   ADD BILL ROW
   ===================================================== */

function addBillRow(){

    const container =
        document.getElementById("billItems");


    const row =
        document.createElement("div");

    row.className =
        "bill-row";


    row.innerHTML = `

        <div>

            <label>Product</label>

            <select class="productSelect">

                ${getProductOptions()}

            </select>

        </div>


        <div>

            <label>Pack Size</label>

            <select class="packSelect">

                <option value="">
                    Select Pack
                </option>

            </select>

        </div>


        <div>

            <label>Qty</label>

            <input
                class="qty"
                type="number"
                min="1"
                value="1">

        </div>


        <div>

            <label>Rate</label>

            <div class="rate">
                ₹0.00
            </div>

        </div>


        <div>

            <label>Amount</label>

            <div class="amount">
                ₹0.00
            </div>

        </div>


        <div>

            <button
                class="red"
                type="button">

                ✕

            </button>

        </div>

    `;


    container.appendChild(row);


    const productSelect =
        row.querySelector(".productSelect");

    const packSelect =
        row.querySelector(".packSelect");

    const qty =
        row.querySelector(".qty");


    productSelect.addEventListener(
        "change",
        function(){

            updateProduct(row);

        }
    );


    packSelect.addEventListener(
        "change",
        function(){

            updatePack(row);

        }
    );


    qty.addEventListener(
        "input",
        calculateBill
    );


    row.querySelector("button")
        .addEventListener(
            "click",
            function(){

                row.remove();

                calculateBill();

            }
        );

}


/* =====================================================
   UPDATE PRODUCT
   ===================================================== */

function updateProduct(row){

    const index =
        Number(
            row.querySelector(".productSelect").value
        );


    const product =
        products[index];


    const packSelect =
        row.querySelector(".packSelect");


    packSelect.innerHTML =
        '<option value="">Select Pack</option>';


    row.dataset.price = "0";


    if(!product){

        row.querySelector(".rate")
            .innerText = "₹0.00";

        calculateBill();

        return;

    }


    const prices =
        product.prices || {};


    Object.entries(prices)
        .forEach(function(entry){

            const pack =
                entry[0];

            const price =
                entry[1];


            const option =
                document.createElement("option");

            option.value =
                pack;

            option.textContent =
                pack +
                " - " +
                money(price);

            packSelect.appendChild(option);

        });


    const packs =
        Object.keys(prices);


    if(packs.length === 1){

        packSelect.value =
            packs[0];

        updatePack(row);

    }

}


/* =====================================================
   UPDATE PACK
   ===================================================== */

function updatePack(row){

    const index =
        Number(
            row.querySelector(".productSelect").value
        );


    const pack =
        row.querySelector(".packSelect").value;


    const product =
        products[index];


    if(!product || !pack){

        row.dataset.price =
            "0";

        row.querySelector(".rate")
            .innerText =
            "₹0.00";

        calculateBill();

        return;

    }


    const price =
        Number(
            product.prices[pack] || 0
        );


    row.dataset.price =
        price;


    row.querySelector(".rate")
        .innerText =
        money(price);


    calculateBill();

}


/* =====================================================
   CALCULATE BILL
   ===================================================== */

function calculateBill(){

    let subtotal =
        0;


    document
        .querySelectorAll(".bill-row")
        .forEach(function(row){

            const price =
                Number(
                    row.dataset.price || 0
                );


            const qty =
                Number(
                    row.querySelector(".qty").value || 0
                );


            const amount =
                price * qty;


            subtotal +=
                amount;


            row.querySelector(".amount")
                .innerText =
                money(amount);

        });


    let discount =
        Number(
            document.getElementById("discount").value || 0
        );


    if(discount < 0){

        discount = 0;

    }


    if(discount > subtotal){

        discount = subtotal;

    }


    document.getElementById("subtotal")
        .innerText =
        money(subtotal);


    document.getElementById("discountTotal")
        .innerText =
        money(discount);


    document.getElementById("grandTotal")
        .innerText =
        money(subtotal - discount);

}


/* =====================================================
   REFRESH PRODUCT DROPDOWNS
   ===================================================== */

function refreshProductDropdowns(){

    document
        .querySelectorAll(".productSelect")
        .forEach(function(select){

            const oldValue =
                select.value;

            select.innerHTML =
                getProductOptions();

            select.value =
                oldValue;

        });

}


/* =====================================================
   COLLECT BILL
   ===================================================== */

function collectBill(){

    const items = [];


    document
        .querySelectorAll(".bill-row")
        .forEach(function(row){

            const index =
                Number(
                    row.querySelector(".productSelect").value
                );


            const product =
                products[index];


            const pack =
                row.querySelector(".packSelect").value;


            const qty =
                Number(
                    row.querySelector(".qty").value || 0
                );


            const rate =
                Number(
                    row.dataset.price || 0
                );


            if(product && pack && qty > 0 && rate > 0){

                items.push({

                    productId:
                        product.productId || "",

                    productName:
                        product.productName,

                    teluguName:
                        product.teluguName || "",

                    packSize:
                        pack,

                    quantity:
                        qty,

                    rate:
                        rate,

                    itemAmount:
                        rate * qty

                });

            }

        });


    return items;

}


/* =====================================================
   SAVE BILL
   ===================================================== */

async function saveBill(){

    const items =
        collectBill();


    if(!items.length){

        alert(
            "Please select at least one product."
        );

        return;

    }


    const subtotal =
        items.reduce(
            function(total,item){

                return total +
                    item.itemAmount;

            },
            0
        );


    let discount =
        Number(
            document.getElementById("discount").value || 0
        );


    if(discount < 0){

        discount = 0;

    }


    if(discount > subtotal){

        discount = subtotal;

    }


    const grandTotal =
        subtotal - discount;


    const bill = {

        action:
            "saveBill",

        billNo:
            document.getElementById("billNo").value,

        billDate:
            document.getElementById("billDate").value,

        customerName:
            document.getElementById("customerName").value ||
            "Walk-in Customer",

        mobile:
            document.getElementById("mobile").value,

        address:
            document.getElementById("address").value,

        items:
            items,

        subtotal:
            subtotal,

        discount:
            discount,

        grandTotal:
            grandTotal,

        paymentMode:
            document.getElementById("paymentMode").value,

        paymentStatus:
            document.getElementById("paymentStatus").value

    };


    showStatus(
        "⏳ Saving bill...",
        ""
    );


    try{

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(bill)

                }
            );


        const text =
            await response.text();


        console.log(
            "Save response:",
            text
        );


        const result =
            JSON.parse(text);


        if(result.success){

            showStatus(
                "✅ Bill saved successfully!",
                "success"
            );

        }else{

            throw new Error(
                result.message ||
                "Unable to save bill."
            );

        }

    }
    catch(error){

        console.error(error);

        showStatus(
            "❌ " + error.message,
            "error"
        );

    }

}


/* =====================================================
   PRINT BILL
   ===================================================== */

function printBill(){

    const items =
        collectBill();


    if(!items.length){

        alert(
            "Please select at least one product."
        );

        return;

    }


    const subtotal =
        items.reduce(
            function(total,item){

                return total +
                    item.itemAmount;

            },
            0
        );


    const discount =
        Math.min(
            Number(
                document.getElementById("discount").value || 0
            ),
            subtotal
        );


    const grandTotal =
        subtotal - discount;


    let rows = "";


    items.forEach(function(item,index){

        rows += `

        <tr>

            <td>
                ${index + 1}
            </td>

            <td>

                ${escapeHTML(item.productName)}

                <br>

                <small>
                    ${escapeHTML(item.teluguName)}
                </small>

            </td>

            <td>
                ${escapeHTML(item.packSize)}
            </td>

            <td>
                ${item.quantity}
            </td>

            <td>
                ${money(item.rate)}
            </td>

            <td>
                ${money(item.itemAmount)}
            </td>

        </tr>

        `;

    });


    const popup =
        window.open(
            "",
            "_blank"
        );


    if(!popup){

        alert(
            "Please allow pop-ups to print the bill."
        );

        return;

    }


    popup.document.write(`

<html>

<head>

<title>
Yatham Organics Bill
</title>

<style>

body{
    font-family:Arial;
    padding:30px;
}

    color:#205b32;
}

table{

    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:9px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

.total{
    font-size:20px;
    font-weight:bold;
}

.right{
    text-align:right;
}

</style>

</head>

<body>

<h1>
YATHAM ORGANICS
</h1>

<p>
Customer Billing
</p>

<hr>

<p>

<b>Bill No:</b>
${escapeHTML(document.getElementById("billNo").value)}

<br>

<b>Date:</b>
${escapeHTML(document.getElementById("billDate").value)}

<br>

<b>Customer:</b>
${escapeHTML(document.getElementById("customerName").value || "Walk-in Customer")}

<br>

<b>Mobile:</b>
${escapeHTML(document.getElementById("mobile").value || "-")}

</p>


<table>

<thead>

<tr>

<th>#</th>

<th>Product</th>

    popup.document.close();

    setTimeout(
        function(){

            popup.print();

        },

}


/* =====================================================
   NEW BILL
   ===================================================== */

function newBill(){

    if(
        !confirm(
            "Start a new bill?"
        )
    ){

        return;

    }


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "mobile"
    ).value = "";


    document.getElementById(
        "address"
    ).value = "";


    document.getElementById(
        "discount"
    ).value = "0";


    document.getElementById(
        "billItems"
    ).innerHTML = "";


    document.getElementById(
        "billNo"
    ).value =
        generateBillNo();


    addBillRow();


    calculateBill();


    showStatus(
        "",
        ""
    );

}


/* =====================================================
   DATE
   ===================================================== */

function setDate(){

    const today =
        new Date()
        .toISOString()
        .slice(0,10);


    document.getElementById(
        "billDate"
    ).value =
        today;

}


/* =====================================================
   START
