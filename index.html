<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Yatham Organics Billing</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial,sans-serif;

background:#f3f6f4;

color:#222;

}


.wrap{

max-width:1200px;

margin:auto;

padding:18px;

}


.header{

background:#214d2b;

color:white;

padding:24px;

border-radius:16px 16px 0 0;

}


.header h1{

margin:0 0 5px;

}


.tabs{

display:flex;

gap:8px;

background:#214d2b;

padding:0 14px 14px;

border-radius:0 0 16px 16px;

}


.tab{

border:0;

background:#e7f0e5;

color:#214d2b;

padding:13px 22px;

font-weight:bold;

cursor:pointer;

border-radius:9px;

}


.tab.active{

background:white;

}


.page{

display:none;

}


.page.active{

display:block;

}


.card{

background:white;

padding:20px;

border-radius:15px;

margin-top:18px;

box-shadow:0 2px 12px #0001;

}


h2{

margin-top:0;

color:#214d2b;

}


.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}


label{

display:block;

font-size:13px;

font-weight:bold;

margin-bottom:6px;

}


input,
select{

width:100%;

padding:11px;

border:1px solid #ccd8c9;

border-radius:9px;

font-size:15px;

background:white;

}


.bill-row{

display:grid;

grid-template-columns:
2fr 130px 80px 110px 120px 45px;

gap:8px;

align-items:end;

margin:14px 0;

}


.amount{

padding:11px 0;

font-weight:bold;

text-align:right;

}


.btn{

border:0;

border-radius:9px;

padding:11px 16px;

font-weight:bold;

cursor:pointer;

margin:3px;

}


.green{

background:#214d2b;

color:white;

}


.light{

background:#e7f0e5;

color:#214d2b;

}


.red{

background:#f8dddd;

color:#a22;

}


.actions{

display:flex;

flex-wrap:wrap;

gap:8px;

}


.summary{

max-width:380px;

margin-left:auto;

}


.sum{

display:flex;

justify-content:space-between;

padding:8px;

}


.grand{

border-top:2px solid #214d2b;

font-size:21px;

font-weight:bold;

padding-top:13px;

}


.status{

margin-top:12px;

font-weight:bold;

}


.success{

color:#168238;

}


.error{

color:#c00000;

}


.loading{

color:#a66a00;

}


.toolbar{

display:grid;

grid-template-columns:1fr 220px;

gap:10px;

}


.catalogue{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(260px,1fr));

gap:14px;

margin-top:18px;

}


.product{

border:1px solid #dce5d9;

border-radius:12px;

padding:15px;

}


.product h3{

margin:0;

color:#214d2b;

}


.telugu{

margin:6px 0;

font-size:16px;

}


.meta{

font-size:12px;

color:#687268;

margin-bottom:8px;

}


.price{

display:flex;

justify-content:space-between;

border-top:1px solid #e5eae3;

padding:8px 0;

}


.empty{

text-align:center;

padding:25px;

color:#687268;

}


@media(max-width:800px){

.grid{

grid-template-columns:1fr;

}

.bill-row{

grid-template-columns:1fr 1fr;

}

.toolbar{

grid-template-columns:1fr;

}

}


@media(max-width:520px){

.wrap{

padding:10px;

}

.tabs{

overflow-x:auto;

}

.tab{

white-space:nowrap;

}

}


@media print{

.no-print{

display:none!important;

}

body{

background:white;

}

#cataloguePage{

display:none!important;

}

#billingPage{

display:block!important;

}

.card{

box-shadow:none;

}

}

</style>

</head>


<body>


<div class="wrap">


<div class="header">

<h1>YATHAM ORGANICS</h1>

<div>
Customer Billing & Product Catalogue
</div>

</div>


<div class="tabs no-print">

<button
class="tab active"
data-page="billingPage">

🧾 Billing

</button>


<button
class="tab"
data-page="cataloguePage">

📦 Product Catalogue

</button>

</div>



<!-- ================= BILLING ================= -->

<section
id="billingPage"
class="page active">


<div class="card">

<h2>Customer Details</h2>


<div class="grid">


<div>

<label>
Customer Name
</label>

<input
id="customer"
placeholder="Walk-in Customer">

</div>


<div>

<label>
Mobile Number
</label>

<input
id="mobile"
placeholder="Optional">

</div>


</div>


<div style="margin-top:14px">

<label>
Address / Community
</label>

<input
id="address"
placeholder="Optional">

</div>


</div>



<div class="card">


<h2>Bill</h2>


<div class="grid">


<div>

<label>
Bill Date
</label>

<input
id="billDate"
type="date">

</div>


<div>

<label>
Discount (₹)
</label>

<input
id="discount"
type="number"
min="0"
step="0.01"
value="0">

</div>


</div>


<div
id="productStatus"
class="status loading">

⏳ Loading products...

</div>


<div id="billItems"></div>


<button
class="btn light no-print"
id="addItemBtn"
type="button">

＋ Add Product

</button>


</div>



<div class="card">


<h2>Payment</h2>


<div class="grid">


<div>

<label>
Payment Mode
</label>

<select id="paymentMode">

<option>Cash</option>

<option>UPI</option>

<option>Card</option>

<option>Bank Transfer</option>

<option>Other</option>

</select>

</div>


<div>

<label>
Payment Status
</label>

<select id="paymentStatus">

<option>Paid</option>

<option>Pending</option>

<option>Partially Paid</option>

</select>

</div>


</div>


</div>



<div class="card">


<div class="summary">


<div class="sum">

<span>
Subtotal
</span>

<b id="subtotal">
₹0.00
</b>

</div>


<div class="sum">

<span>
Discount
</span>

<b id="discountTotal">
₹0.00
</b>

</div>


<div class="sum grand">

<span>
Grand Total
</span>

<span id="grandTotal">
₹0.00
</span>

</div>


</div>

</div>



<div class="card no-print">


<div class="actions">


<button
class="btn green"
id="saveBtn"
type="button">

💾 Save Bill

</button>


<button
class="btn green"
id="printBtn"
type="button">

🖨 Print Bill

</button>


<button
class="btn light"
id="newBtn"
type="button">

＋ New Bill

</button>


<button
class="btn light"
id="refreshBtn"
type="button">

🔄 Refresh Products

</button>


</div>


<div
id="saveStatus"
class="status">

</div>


</div>


</section>



<!-- ================= CATALOGUE ================= -->

<section
id="cataloguePage"
class="page">


<div class="card">


<h2>
Product Catalogue
</h2>


<div class="toolbar">


<input
id="search"
placeholder="Search product / Telugu / category">


<select id="category">

<option value="">
All Categories
</option>

</select>


</div>


<div
id="catalogueStatus"
class="status loading">

⏳ Loading products...

</div>


<div
id="catalogue"
class="catalogue">

</div>


</div>


</section>


</div>



<script>


/* ==================================================
   GOOGLE APPS SCRIPT URL
================================================== */


const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyV4y5p_SCHkL7SvNWpAux2CwLBmmfOnLH7BKXKytqlNkt9AjPZnsZtJNVzusJbtwRAOA/exec";


let products = [];



/* ==================================================
   HELPERS
================================================== */


function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}



function money(value){

return "₹" +
Number(value || 0)
.toFixed(2);

}



function setStatus(
id,
text,
type=""
){

const element =
document.getElementById(id);

element.className =
"status " + type;

element.textContent =
text;

}



/* ==================================================
   TABS
================================================== */


document
.querySelectorAll(".tab")
.forEach(function(button){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tab")
.forEach(function(tab){

tab.classList.remove("active");

});


document
.querySelectorAll(".page")
.forEach(function(page){

page.classList.remove("active");

});


button.classList.add("active");


document
.getElementById(
button.dataset.page
)
.classList.add("active");


});

});



/* ==================================================
   LOAD PRODUCTS
================================================== */


async function loadProducts(){

setStatus(
"productStatus",
"⏳ Loading products from Google Sheets...",
"loading"
);


setStatus(
"catalogueStatus",
"⏳ Loading products from Google Sheets...",
"loading"
);


try{


const response =
await fetch(
SCRIPT_URL +
"?action=products&ts=" +
Date.now()
);


if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}


const result =
await response.json();


if(!result.success){

throw new Error(
result.message ||
"Unable to load products"
);

}


products =
result.products || [];


setStatus(
"productStatus",
"✅ " +
products.length +
" products loaded from Google Sheets.",
"success"
);


setStatus(
"catalogueStatus",
"✅ " +
products.length +
" products loaded from Google Sheets.",
"success"
);


renderCategories();


renderCatalogue();


document
.getElementById("billItems")
.innerHTML="";


addBillItem();


calculate();


}
catch(error){


console.error(error);


setStatus(
"productStatus",
"❌ Unable to load products. " +
error.message,
"error"
);


setStatus(
"catalogueStatus",
"❌ Unable to load products. " +
error.message,
"error"
);


}

}



/* ==================================================
   PRODUCT OPTIONS
================================================== */


function productOptions(){

return (

'<option value="">Select Product</option>' +

products
.map(function(product,index){

return (

'<option value="' +
index +
'">' +

esc(product.productName) +

(
product.teluguName
?
" — " +
esc(product.teluguName)
:
""
) +

'</option>'

);

})
.join("")

);

}



/* ==================================================
   ADD BILL ROW
================================================== */


function addBillItem(){

const row =
document.createElement("div");


row.className =
"bill-row";


row.innerHTML =

'<div>' +

'<label>Product</label>' +

'<select class="productSelect">' +

productOptions() +

'</select>' +

'</div>' +


'<div>' +

'<label>Pack Size</label>' +

'<select class="packSelect">' +

'<option value="">Select Pack</option>' +

'</select>' +

'</div>' +


'<div>' +

'<label>Qty</label>' +

'<input class="qty" type="number" min="1" value="1">' +

'</div>' +


'<div>' +

'<label>Rate</label>' +

'<div class="rate amount">₹0.00</div>' +

'</div>' +


'<div>' +

'<label>Amount</label>' +

'<div class="lineAmount amount">₹0.00</div>' +

'</div>' +


'<button class="btn red removeBtn" type="button">✕</button>';


document
.getElementById("billItems")
.appendChild(row);



row
.querySelector(".productSelect")
.addEventListener(
"change",
function(){

updateProductRow(row);

}
);



row
.querySelector(".packSelect")
.addEventListener(
"change",
function(){

updatePackRow(row);

}
);



row
.querySelector(".qty")
.addEventListener(
"input",
calculate
);



row
.querySelector(".removeBtn")
.addEventListener(
"click",
function(){

row.remove();

calculate();

}
);

}



/* ==================================================
   PRODUCT CHANGE
================================================== */


function updateProductRow(row){

const index =
Number(
row.querySelector(
".productSelect"
).value
);


const product =
products[index];


const pack =
row.querySelector(
".packSelect"
);


pack.innerHTML =
'<option value="">Select Pack</option>';


if(!product){

row.dataset.price="0";

row.querySelector(
".rate"
).textContent="₹0.00";

calculate();

return;

}


/*
Products sheet has ONE pack size
per product row.

If your Pack Size contains:
500 g, 1 Kg

both will be available.
*/


const packSizes =
String(
product.packSize || ""
)
.split(",")
.map(function(x){

return x.trim();

})
.filter(Boolean);


if(packSizes.length){

packSizes.forEach(function(size){

pack.insertAdjacentHTML(
"beforeend",

'<option value="' +
esc(size) +
'">' +
esc(size) +
'</option>'

);

});


pack.value =
packSizes[0];


updatePackRow(row);


}
else{


row.dataset.price =
String(
Number(
product.sellingPrice
) || 0
);


row.querySelector(
".rate"
).textContent =
money(
product.sellingPrice
);


calculate();

}

}



/* ==================================================
   PACK CHANGE
================================================== */


function updatePackRow(row){

const index =
Number(
row.querySelector(
".productSelect"
).value
);


const product =
products[index];


if(!product){

return;

}


const price =
Number(
product.sellingPrice
) || 0;


row.dataset.price =
String(price);


row.querySelector(
".rate"
).textContent =
price
?
money(price)
:
"Price not set";


calculate();

}



/* ==================================================
   CALCULATE
================================================== */


function calculate(){

let subtotal = 0;


document
.querySelectorAll(".bill-row")
.forEach(function(row){

const price =
Number(
row.dataset.price || 0
);


const qty =
Number(
row.querySelector(
".qty"
).value || 0
);


const amount =
price * qty;


subtotal += amount;


row.querySelector(
".lineAmount"
).textContent =
money(amount);

});


const discount =
Math.min(

Math.max(

Number(
document.getElementById(
"discount"
).value || 0
),

0

),

subtotal

);


document.getElementById(
"subtotal"
).textContent =
money(subtotal);


document.getElementById(
"discountTotal"
).textContent =
money(discount);


document.getElementById(
"grandTotal"
).textContent =
money(
subtotal - discount
);

}



/* ==================================================
   GET BILL DATA
================================================== */


function getBillData(){

const items = [];

let subtotal = 0;


document
.querySelectorAll(".bill-row")
.forEach(function(row){


const index =
Number(
row.querySelector(
".productSelect"
).value
);


const product =
products[index];


const packSize =
row.querySelector(
".packSelect"
).value;


const quantity =
Number(
row.querySelector(
".qty"
).value || 0
);


const rate =
Number(
row.dataset.price || 0
);


if(
product &&
quantity > 0 &&
rate > 0
){


const amount =
quantity * rate;


subtotal += amount;


items.push({

productId:
product.productId || "",

productName:
product.productName || "",

teluguName:
product.teluguName || "",

packSize:
packSize ||
product.packSize ||
"",

quantity:
quantity,

rate:
rate,

amount:
amount

});

}

});


const discount =
Math.min(

Math.max(

Number(
document.getElementById(
"discount"
).value || 0
),

0

),

subtotal

);


return {

action:
"saveBill",


billId:
"BILL-" +
Date.now(),


billDate:
document.getElementById(
"billDate"
).value,


customerName:
document.getElementById(
"customer"
).value ||
"Walk-in Customer",


mobile:
document.getElementById(
"mobile"
).value ||
"",


address:
document.getElementById(
"address"
).value ||
"",


subtotal:
subtotal,


discount:
discount,


grandTotal:
subtotal - discount,


paymentMode:
document.getElementById(
"paymentMode"
).value,


paymentStatus:
document.getElementById(
"paymentStatus"
).value,


items:
items

};

}



/* ==================================================
   SAVE BILL
================================================== */


async function saveBill(){

const data =
getBillData();


if(!data.items.length){

setStatus(
"saveStatus",
"❌ Please select at least one product.",
"error"
);

return;

}


setStatus(
"saveStatus",
"⏳ Saving bill to Google Sheets...",
"loading"
);


try{


const response =
await fetch(
SCRIPT_URL,
{

method:"POST",

body:JSON.stringify(data)

}
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const result =
await response.json();


if(!result.success){

throw new Error(
result.message ||
"Save failed"
);

}


setStatus(
"saveStatus",
"✅ Bill saved successfully. Bill ID: " +
result.billId,
"success"
);


}
catch(error){


console.error(error);


setStatus(
"saveStatus",
"❌ Error while saving bill: " +
error.message,
"error"
);

}

}



/* ==================================================
   PRINT
================================================== */


function printBill(){

const data =
getBillData();


if(!data.items.length){

alert(
"Please select at least one product."
);

return;

}


const rows =
data.items
.map(function(item,index){

return (

"<tr>" +

"<td>" +
(index + 1) +
"</td>" +

"<td>" +
esc(item.productName) +
"<br><small>" +
esc(item.teluguName) +
"</small>" +
"</td>" +

"<td>" +
esc(item.packSize) +
"</td>" +

"<td>" +
item.quantity +
"</td>" +

"<td>" +
money(item.rate) +
"</td>" +

"<td>" +
money(item.amount) +
"</td>" +

"</tr>"

);

})
.join("");


const popup =
window.open(
"",
"_blank"
);


if(!popup){

alert(
"Please allow pop-ups."
);

return;

}


popup.document.write(

"<!DOCTYPE html>" +

"<html>" +

"<head>" +

"<title>" +
esc(data.billId) +
"</title>" +

"<style>" +

"body{font-family:Arial;padding:25px}" +

"h1{color:#214d2b}" +

"table{width:100%;border-collapse:collapse;margin-top:20px}" +

"th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}" +

".right{text-align:right}" +

".total{font-size:20px;font-weight:bold}" +

"</style>" +

"</head>" +

"<body>" +

"<h1>YATHAM ORGANICS</h1>" +

"<div>Customer Bill</div>" +

"<hr>" +

"<p>" +

"<b>Bill ID:</b> " +
esc(data.billId) +

"<br>" +

"<b>Date:</b> " +
esc(data.billDate) +

"<br>" +

"<b>Customer:</b> " +
esc(data.customerName) +

"<br>" +

"<b>Mobile:</b> " +
esc(data.mobile || "-") +

"<br>" +

"<b>Payment:</b> " +
esc(data.paymentMode) +
" / " +
esc(data.paymentStatus) +

"</p>" +

"<table>" +

"<thead>" +

"<tr>" +

"<th>#</th>" +

"<th>Product</th>" +

"<th>Pack</th>" +

"<th>Qty</th>" +

"<th>Rate</th>" +

"<th>Amount</th>" +

"</tr>" +

"</thead>" +

"<tbody>" +

rows +

"</tbody>" +

"</table>" +

"<div class='right'>" +

"<p>Subtotal: <b>" +
money(data.subtotal) +
"</b></p>" +

"<p>Discount: <b>" +
money(data.discount) +
"</b></p>" +

"<p class='total'>Grand Total: " +
money(data.grandTotal) +
"</p>" +

"</div>" +

"<p style='text-align:center;margin-top:35px'>" +

"Thank you for choosing Yatham Organics!" +

"</p>" +

"</body>" +

"</html>"

);


popup.document.close();

popup.focus();


setTimeout(
function(){

popup.print();

},
500
);

}



/* ==================================================
   NEW BILL
================================================== */


function newBill(){

document.getElementById(
"customer"
).value="";


document.getElementById(
"mobile"
).value="";


document.getElementById(
"address"
).value="";


document.getElementById(
"discount"
).value="0";


document.getElementById(
"paymentMode"
).value="Cash";


document.getElementById(
"paymentStatus"
).value="Paid";


document.getElementById(
"saveStatus"
).textContent="";


document.getElementById(
"billItems"
).innerHTML="";


addBillItem();


calculate();

}



/* ==================================================
   CATEGORIES
================================================== */


function renderCategories(){

const select =
document.getElementById(
"category"
);


const categories =
[
...new Set(

products
.map(function(p){

return p.category;

})
.filter(Boolean)

)
].sort();


select.innerHTML =
'<option value="">All Categories</option>' +

categories
.map(function(category){

return (

'<option value="' +
esc(category) +
'">' +
esc(category) +
'</option>'

);

})
.join("");

}



/* ==================================================
   CATALOGUE
================================================== */


function renderCatalogue(){

const search =
document.getElementById(
"search"
)
.value
.toLowerCase()
.trim();


const category =
document.getElementById(
"category"
).value;


const list =
products.filter(function(product){


const text = [

product.productId,

product.productName,

product.teluguName,

product.category,

product.packSize

]
.join(" ")
.toLowerCase();


return (

(!search ||
text.includes(search))

&&

(!category ||
product.category === category)

);

});


const box =
document.getElementById(
"catalogue"
);


if(!list.length){

box.innerHTML =
'<div class="empty">No products found.</div>';

return;

}


box.innerHTML =
list
.map(function(product){

return (

'<div class="product">' +

"<h3>" +
esc(product.productName) +
"</h3>" +

'<div class="telugu">' +
esc(product.teluguName) +
"</div>" +

'<div class="meta">' +

"ID: " +
esc(product.productId) +

" • " +

esc(product.category) +

"</div>" +

'<div class="price">' +

"<span>Pack Size</span>" +

"<b>" +
esc(product.packSize) +
"</b>" +

"</div>" +

'<div class="price">' +

"<span>Selling Price</span>" +

"<b>" +
money(product.sellingPrice) +
"</b>" +

"</div>" +
